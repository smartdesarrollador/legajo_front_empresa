<div class="container mx-auto px-4 py-8 max-w-2xl">
  <h2 class="text-2xl font-bold mb-6 text-gray-800">Editar Permiso</h2>

  <form [formGroup]="permisoForm" (ngSubmit)="onSubmit()" class="space-y-6">
    <!-- Fecha de inicio -->
    <div class="flex flex-col">
      <label for="fecha_inicio" class="text-sm font-medium text-gray-700 mb-1">
        Fecha de inicio:
      </label>
      <input
        type="date"
        id="fecha_inicio"
        formControlName="fecha_inicio"
        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2"
      />
      <div
        *ngIf="
          permisoForm.get('fecha_inicio')?.touched &&
          permisoForm.get('fecha_inicio')?.invalid
        "
        class="text-red-500 text-sm mt-1"
      >
        La fecha de inicio es requerida
      </div>
    </div>

    <!-- Fecha fin -->
    <div class="flex flex-col">
      <label for="fecha_fin" class="text-sm font-medium text-gray-700 mb-1">
        Fecha fin:
      </label>
      <input
        type="date"
        id="fecha_fin"
        formControlName="fecha_fin"
        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2"
      />
      <div
        *ngIf="
          permisoForm.get('fecha_fin')?.touched &&
          permisoForm.get('fecha_fin')?.invalid
        "
        class="text-red-500 text-sm mt-1"
      >
        La fecha fin es requerida
      </div>
    </div>

    <!-- Horas -->
    <div class="flex flex-col">
      <label for="horas" class="text-sm font-medium text-gray-700 mb-1">
        Número de horas:
      </label>
      <input
        type="number"
        id="horas"
        formControlName="horas"
        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2"
      />
      <div
        *ngIf="
          permisoForm.get('horas')?.touched && permisoForm.get('horas')?.invalid
        "
        class="text-red-500 text-sm mt-1"
      >
        El número de horas es requerido y debe ser mayor a 0
      </div>
    </div>

    <!-- Motivo -->
    <div class="flex flex-col">
      <label for="motivo" class="text-sm font-medium text-gray-700 mb-1">
        Motivo de Solicitud:
      </label>
      <textarea
        id="motivo"
        formControlName="motivo"
        rows="4"
        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2"
      ></textarea>
      <div
        *ngIf="
          permisoForm.get('motivo')?.touched &&
          permisoForm.get('motivo')?.invalid
        "
        class="text-red-500 text-sm mt-1"
      >
        El motivo es requerido
      </div>
    </div>

    <!-- Área -->
    <div class="flex flex-col">
      <label for="id_area" class="text-sm font-medium text-gray-700 mb-1">
        Área:
      </label>
      <select
        id="id_area"
        formControlName="id_area"
        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2"
      >
        <option value="">Seleccione un área</option>
        <option *ngFor="let area of areas" [value]="area.id_area">
          {{ area.area }}
        </option>
      </select>
      <div
        *ngIf="
          permisoForm.get('id_area')?.touched &&
          permisoForm.get('id_area')?.invalid
        "
        class="text-red-500 text-sm mt-1"
      >
        El área es requerida
      </div>
    </div>

    <!-- Trabajador -->
    <div class="flex flex-col">
      <label for="id_trabajador" class="text-sm font-medium text-gray-700 mb-1">
        Trabajador:
      </label>
      <select
        id="id_trabajador"
        formControlName="id_trabajador"
        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2"
      >
        <option value="">Seleccione un trabajador</option>
        <option
          *ngFor="let trabajador of trabajadores"
          [value]="trabajador.id_trabajador"
        >
          {{ trabajador.primer }} {{ trabajador.paterno }}
        </option>
      </select>
      <div
        *ngIf="
          permisoForm.get('id_trabajador')?.touched &&
          permisoForm.get('id_trabajador')?.invalid
        "
        class="text-red-500 text-sm mt-1"
      >
        El trabajador es requerido
      </div>
    </div>

    <!-- Jefe Inmediato -->
    <div class="flex flex-col">
      <label
        for="jefe_inmediato"
        class="text-sm font-medium text-gray-700 mb-1"
      >
        Jefe Inmediato:
      </label>
      <input
        type="text"
        id="jefe_inmediato"
        formControlName="jefe_inmediato"
        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2"
      />
      <div
        *ngIf="
          permisoForm.get('jefe_inmediato')?.touched &&
          permisoForm.get('jefe_inmediato')?.invalid
        "
        class="text-red-500 text-sm mt-1"
      >
        El jefe inmediato es requerido
      </div>
    </div>

    <!-- Estado del Permiso -->
    <div class="flex flex-col">
      <label
        for="id_estado_permiso"
        class="text-sm font-medium text-gray-700 mb-1"
      >
        Estado del Permiso:
      </label>
      <select
        id="id_estado_permiso"
        formControlName="id_estado_permiso"
        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2"
      >
        <option value="">Seleccione un estado</option>
        <option
          *ngFor="let estado of estadosPermiso"
          [value]="estado.id_estado_permiso"
        >
          {{ estado.estado_permiso }}
        </option>
      </select>
      <div
        *ngIf="
          permisoForm.get('id_estado_permiso')?.touched &&
          permisoForm.get('id_estado_permiso')?.invalid
        "
        class="text-red-500 text-sm mt-1"
      >
        El estado del permiso es requerido
      </div>
    </div>

    <!-- Botones de acción -->
    <div class="flex gap-4">
      <button
        type="submit"
        [disabled]="!permisoForm.valid || loading"
        class="flex-1 bg-indigo-600 text-white px-4 py-2 rounded-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 transition-colors duration-200 disabled:opacity-50"
      >
        {{ loading ? "Guardando..." : "Guardar Cambios" }}
      </button>
      <button
        type="button"
        (click)="cancelar()"
        class="flex-1 bg-gray-200 text-gray-700 px-4 py-2 rounded-md hover:bg-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-offset-2 transition-colors duration-200"
      >
        Cancelar
      </button>
    </div>
  </form>
</div>
