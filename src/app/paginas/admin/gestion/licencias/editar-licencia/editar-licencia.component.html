<div class="w-1/2 max-w-2xl mx-auto my-12 bg-white p-8 rounded-2xl shadow-md">
  <h2 class="text-2xl text-orange-500 font-bold mb-6">Editar Licencia</h2>

  <form [formGroup]="editarForm" (ngSubmit)="onSubmit()">
    <div class="mb-4">
      <label for="fecha_emision" class="block font-bold text-gray-700 mb-2">
        Fecha de solicitud:
      </label>
      <input
        type="date"
        id="fecha_emision"
        formControlName="fecha_emision"
        class="w-4/5 p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-orange-500"
        [ngClass]="{ 'border-red-500': isFieldInvalid('fecha_emision') }"
        required
      />
      <div
        *ngIf="isFieldInvalid('fecha_emision')"
        class="text-red-500 text-sm mt-1"
      >
        {{ getErrorMessage("fecha_emision") }}
      </div>
    </div>

    <div class="mb-4">
      <label for="fecha_inicio" class="block font-bold text-gray-700 mb-2">
        Comenzando en:
      </label>
      <input
        type="date"
        id="fecha_inicio"
        formControlName="fecha_inicio"
        class="w-4/5 p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-orange-500"
        [ngClass]="{ 'border-red-500': isFieldInvalid('fecha_inicio') }"
        required
      />
      <div
        *ngIf="isFieldInvalid('fecha_inicio')"
        class="text-red-500 text-sm mt-1"
      >
        {{ getErrorMessage("fecha_inicio") }}
      </div>
    </div>

    <div class="mb-4">
      <label for="fecha_fin" class="block font-bold text-gray-700 mb-2">
        Terminando en:
      </label>
      <input
        type="date"
        id="fecha_fin"
        formControlName="fecha_fin"
        class="w-4/5 p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-orange-500"
        [ngClass]="{ 'border-red-500': isFieldInvalid('fecha_fin') }"
        required
      />
      <div
        *ngIf="isFieldInvalid('fecha_fin')"
        class="text-red-500 text-sm mt-1"
      >
        {{ getErrorMessage("fecha_fin") }}
      </div>
    </div>

    <div class="mb-4">
      <label for="motivo" class="block font-bold text-gray-700 mb-2">
        Motivo de Solicitud:
      </label>
      <textarea
        id="motivo"
        formControlName="motivo"
        class="w-4/5 p-3 border border-gray-300 rounded-lg h-24 focus:ring-2 focus:ring-orange-500 focus:border-orange-500"
        [ngClass]="{ 'border-red-500': isFieldInvalid('motivo') }"
        required
      ></textarea>
      <div *ngIf="isFieldInvalid('motivo')" class="text-red-500 text-sm mt-1">
        {{ getErrorMessage("motivo") }}
      </div>
    </div>

    <div class="mb-6">
      <label class="block font-bold text-gray-700 mb-2">Goce de Haber:</label>
      <div class="flex gap-6 items-center">
        <div class="flex items-center">
          <input
            type="radio"
            id="goce_si"
            formControlName="goce_haber"
            value="si"
            class="w-4 h-4 text-orange-500 focus:ring-orange-500"
          />
          <label for="goce_si" class="ml-2">Sí</label>
        </div>
        <div class="flex items-center">
          <input
            type="radio"
            id="goce_no"
            formControlName="goce_haber"
            value="no"
            class="w-4 h-4 text-orange-500 focus:ring-orange-500"
          />
          <label for="goce_no" class="ml-2">No</label>
        </div>
      </div>
      <div
        *ngIf="isFieldInvalid('goce_haber')"
        class="text-red-500 text-sm mt-1"
      >
        {{ getErrorMessage("goce_haber") }}
      </div>
    </div>

    <div class="flex gap-4">
      <button
        type="submit"
        class="w-1/3 py-3 bg-green-600 text-white rounded-lg hover:bg-green-700 transition-colors duration-200"
        [disabled]="!editarForm.valid"
      >
        Actualizar
      </button>
      <button
        type="button"
        class="w-1/3 py-3 bg-gray-500 text-white rounded-lg hover:bg-gray-600 transition-colors duration-200"
        (click)="volver()"
      >
        Volver
      </button>
    </div>
  </form>
</div>
