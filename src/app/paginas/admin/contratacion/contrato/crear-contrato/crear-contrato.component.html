<div class="container mt-4">
  <div class="card">
    <div class="card-header">
      <h2>Crear Contrato</h2>
    </div>
    <div class="card-body">
      <div *ngIf="loading" class="text-center">
        <div class="spinner-border" role="status">
          <span class="visually-hidden">Cargando...</span>
        </div>
      </div>

      <div *ngIf="error" class="alert alert-danger">
        {{ error }}
      </div>

      <div *ngIf="contratoData">
        <div class="row mb-3">
          <div class="col">
            <button
              class="btn btn-primary"
              (click)="crearContrato()"
              [disabled]="loading"
            >
              Crear Contrato
            </button>
          </div>
        </div>

        <div class="row">
          <div class="col">
            <h4>Datos del Contrato:</h4>
            <pre>{{ JSON.stringify(contratoData, null, 2) }}</pre>
          </div>
        </div>
      </div>

      <div *ngIf="!contratoData" class="alert alert-warning">
        No se encontraron datos del contrato en el almacenamiento local.
      </div>
    </div>
  </div>
</div>
